<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
</head>
<body>

    <h1>User Registration</h1>

    <form>

        <label for="full-name">Full Name</label>
        <input type="text" id="full-name" required minlength="2">

        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" required minlength="8">

        <p>Account Type</p>

        <label for="student">Student</label>
        <input type="radio" id="student" name="account-type" value="student" required>

        <label for="professional">Professional</label>
        <input type="radio" id="professional" name="account-type" value="professional">

        <label for="country">Country</label>
        <select id="country" required>
            <option value="">Select a country</option>
            <option value="jordan">Jordan</option>
            <option value="usa">United States</option>
            <option value="uk">United Kingdom</option>
        </select>

        <label for="about">About You</label>
        <textarea id="about" required minlength="10"></textarea>

        <input type="checkbox" id="agreement" required>
        <label for="agreement">I agree to the terms and conditions.</label>

        <button type="submit">Register</button>

    </form>

</body>
</html>
